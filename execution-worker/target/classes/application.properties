spring.application.name=execution-worker
server.port=8090

# Worker Authentication Secret (must be provided via environment variable)
worker.secret=${EXECUTION_WORKER_SECRET:}

# Execution & Sandbox Limits
execution.max-concurrent=${EXECUTION_MAX_CONCURRENT:4}
execution.timeout-seconds=${EXECUTION_TIMEOUT_SECONDS:10}
execution.memory-limit=${EXECUTION_MEMORY_LIMIT:256m}
execution.cpu-limit=${EXECUTION_CPU_LIMIT:1.0}
execution.pids-limit=${EXECUTION_PIDS_LIMIT:64}
execution.max-output-size=${EXECUTION_MAX_OUTPUT_SIZE:65536}
execution.network-disabled=${EXECUTION_NETWORK_DISABLED:true}

# Sandbox Docker Images
execution.java-image=${DOCKER_JAVA_IMAGE:cloud-ide-java:latest}
execution.python-image=${DOCKER_PYTHON_IMAGE:cloud-ide-python:latest}
execution.c-image=${DOCKER_C_IMAGE:cloud-ide-c:latest}
execution.cpp-image=${DOCKER_CPP_IMAGE:cloud-ide-cpp:latest}
