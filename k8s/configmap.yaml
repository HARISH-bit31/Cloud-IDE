apiVersion: v1
kind: ConfigMap
metadata:
  name: cloud-ide-config
  namespace: cloud-ide
  labels:
    app.kubernetes.io/name: cloud-ide
    app.kubernetes.io/component: config
data:
  SPRING_PROFILES_ACTIVE: "prod"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "cloud_ide"
  SERVER_PORT: "8088"
  EXECUTION_WORKER_URL: "http://host.docker.internal:8090"
  EXECUTION_QUEUE_CAPACITY: "20"
  EXECUTION_WORKER_CONCURRENCY: "4"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://localhost:30080,http://localhost:80,http://cloud-ide.local"
