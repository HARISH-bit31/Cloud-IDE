apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-ide-ingress
  namespace: cloud-ide
  labels:
    app.kubernetes.io/name: cloud-ide
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  rules:
    - host: cloud-ide.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8088
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
