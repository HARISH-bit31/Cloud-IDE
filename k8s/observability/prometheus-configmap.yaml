apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cloud-ide
  labels:
    app.kubernetes.io/name: cloud-ide
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    scrape_configs:
      - job_name: 'cloud-ide-backend'
        metrics_path: '/actuator/prometheus'
        scrape_interval: 5s
        static_configs:
          - targets: ['backend:8088']
            labels:
              app: 'backend'
              environment: 'local-k8s'
