# Example Kubernetes Secret template for Cloud IDE
# DO NOT commit real secrets into Git.
#
# To create the secret in your Kubernetes cluster, either edit a copy of this file
# or run the following kubectl command:
#
# kubectl create secret generic cloud-ide-secrets \
#   --namespace cloud-ide \
#   --from-literal=MYSQL_ROOT_PASSWORD=root_secret \
#   --from-literal=MYSQL_USER=cloudide \
#   --from-literal=MYSQL_PASSWORD=cloudide_secret \
#   --from-literal=JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970 \
#   --from-literal=EXECUTION_WORKER_SECRET=replace-with-a-long-random-secret
#
apiVersion: v1
kind: Secret
metadata:
  name: cloud-ide-secrets
  namespace: cloud-ide
  labels:
    app.kubernetes.io/name: cloud-ide
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "root_secret"
  MYSQL_USER: "cloudide"
  MYSQL_PASSWORD: "cloudide_secret"
  JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  EXECUTION_WORKER_SECRET: "replace-with-a-long-random-secret"
