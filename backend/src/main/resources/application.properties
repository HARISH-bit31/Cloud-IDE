# Server Configuration
server.port=${SERVER_PORT:8088}
server.servlet.context-path=/

# Application Name
spring.application.name=cloud-ide-backend

# MySQL Datasource Configuration (with sensible environment variable fallbacks)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloud_ide}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# CORS Allowed Origins
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

# JWT Configuration (override via JWT_SECRET and JWT_EXPIRATION environment variables)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Execution Engine Configuration
execution.timeout-seconds=10
execution.memory-limit=256m
execution.cpu-limit=1.0
execution.max-output-size=65536
execution.network-disabled=true
execution.pids-limit=64
execution.java-image=${DOCKER_JAVA_IMAGE:cloud-ide-java:latest}
execution.python-image=${DOCKER_PYTHON_IMAGE:cloud-ide-python:latest}
execution.c-image=${DOCKER_C_IMAGE:cloud-ide-c:latest}
execution.cpp-image=${DOCKER_CPP_IMAGE:cloud-ide-cpp:latest}

# Logging
logging.level.com.cloudide.cloudide=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG


