# Production Profile Configuration
server.port=${SERVER_PORT:8088}

spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cloud_ide}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:cloudide}
spring.datasource.password=${DB_PASSWORD:cloudide_secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Graceful Shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://localhost:3000,http://localhost:30080,http://cloud-ide.local}

jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Execution Worker Configuration (must be provided via environment variable)
execution.worker.url=${EXECUTION_WORKER_URL:http://host.docker.internal:8090}
execution.worker.secret=${EXECUTION_WORKER_SECRET:}
execution.queue.capacity=${EXECUTION_QUEUE_CAPACITY:20}
execution.worker.concurrency=${EXECUTION_WORKER_CONCURRENCY:4}

# Actuator & Observability
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=never
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=cloud-ide-backend

# Logging
logging.level.com.cloudide.cloudide=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
